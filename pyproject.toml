[project]
name = "washout"
version = "0.1.0"
description = "Automated blended-wing-body design: CFD-informed search to vase-mode printable STL"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Say which package this is, explicitly. `data/` and `results/` are
# evidence, not importable code, but setuptools' flat-layout autodiscovery
# sees four top-level directories and refuses to guess between them.
[tool.setuptools.packages.find]
include = ["washout*"]
