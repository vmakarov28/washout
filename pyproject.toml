[project]
name = "washout"
version = "0.1.0"
description = "Automated blended-wing-body design: CFD-informed search to vase-mode printable STL"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# `faker` is not used here -- it arrives as a transitive dependency and
# auto-registers a pytest plugin whose session fixture walks every
# installed module with `pkgutil.iter_modules`. With the OCC bindings
# installed (cadquery-ocp pulls vtk, which has an unusual module layout)
# that walk dies with a Windows access violation during fixture setup,
# taking the run with it. Nothing in this repo needs the plugin.
addopts = "-p no:faker"

# Say which package this is, explicitly. `data/` and `results/` are
# evidence, not importable code, but setuptools' flat-layout autodiscovery
# sees four top-level directories and refuses to guess between them.
[tool.setuptools.packages.find]
include = ["washout*"]
